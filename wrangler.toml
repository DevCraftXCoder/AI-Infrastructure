name = "ai-gateway"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[[d1_databases]]
binding = "DB"
database_name = "ai-gateway-db"
database_id = "5e69e8ef-3f8d-4ffe-b676-be07fe0dc2a6"

[[unsafe.bindings]]
name = "GATEWAY_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1"
simple = { limit = 60, period = 60 }

[vars]
FALLBACK_MODEL = "anthropic/claude-haiku-4.5"
OPENROUTER_BASE_URL = "https://openrouter.ai/api/v1/chat/completions"
HTTP_REFERER = "https://ai-gateway.frxncois.workers.dev"
X_TITLE = "AI Gateway"

[triggers]
crons = ["*/5 * * * *", "0 3 * * *"]
